name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BINGO_SIGNING_BASE64: ${{ secrets.BINGO_SIGNING_BASE64 }}
      BINGO_KEY_PASSWORD: ${{ secrets.BINGO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK and verify signature
        shell: bash
        run: |
          mkdir -p artifacts
          if [[ -n "$BINGO_SIGNING_BASE64" || -n "$BINGO_KEY_PASSWORD" ]]; then
            : "${BINGO_SIGNING_BASE64:?Missing BINGO_SIGNING_BASE64}"
            : "${BINGO_KEY_PASSWORD:?Missing BINGO_KEY_PASSWORD}"
            umask 077
            export BINGO_KEYSTORE="$RUNNER_TEMP/todobingo.p12"
            trap 'rm -f "$BINGO_KEYSTORE"' EXIT
            printf '%s' "$BINGO_SIGNING_BASE64" | base64 --decode > "$BINGO_KEYSTORE"
            bash ./gradlew :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk artifacts/TODO-BINGO.apk
          else
            bash ./gradlew :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/TODO-BINGO-test.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TODO-BINGO-APK
          path: artifacts/*.apk
          if-no-files-found: error
